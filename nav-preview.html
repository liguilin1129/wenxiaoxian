<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文小贤 · 导航栏真实预览（1:1 还原 WXSS）</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #333;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  }

  /* 手机外壳 */
  .phone {
    width: 375px;
    height: 812px;
    background: #F5F5F7;
    border-radius: 44px;
    border: 10px solid #111;
    position: relative;
    overflow: hidden;
    box-shadow: 0 30px 60px rgba(0,0,0,.5);
  }
  .phone::before { /* 刘海 */
    content: ''; position: absolute; top: 0; left: 50%; transform: translateX(-50%);
    width: 160px; height: 28px; background: #111; border-radius: 0 0 18px 18px; z-index: 50;
  }
  .screen-content {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    padding: 60px 24px 140px;
  }
  .demo-card { background:#fff; border-radius:16px; padding:20px; margin-bottom:16px; box-shadow:0 2px 8px rgba(17,17,26,.04); }
  .demo-card h3 { font-size:18px; margin-bottom:8px; }
  .demo-card p { font-size:14px; color:#8B8B9E; line-height:1.6; }

  /* ========== 以下完全还原 custom-tab-bar/index.wxss（rpx→px ÷2） ========== */
  .tabbar {
    position: absolute;
    left: 14px;
    right: 14px;
    bottom: 4px;
    height: 48px;
    display: flex;
    align-items: center;
    justify-content: space-around;
    background: rgba(255, 255, 255, 0.62);
    border: 0.5px solid rgba(255, 255, 255, 0.9);
    border-radius: 15px;
    box-shadow: 0 5px 15px rgba(99, 102, 241, 0.18);
    -webkit-backdrop-filter: blur(14px);
    backdrop-filter: blur(14px);
    overflow: hidden;
    z-index: 999;
  }
  .glass-wash {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    border-radius: 15px;
    background: linear-gradient(90deg, rgba(99,102,241,0.12), rgba(99,102,241,0.05));
    z-index: 0;
  }
  .tb {
    position: relative; z-index: 1;
    flex: 1; height: 100%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    color: #B0B0BF; font-size: 11px; transition: color .2s;
  }
  .tb.on { color: #6366F1; }
  .icon-wrap {
    position: relative; width: 24px; height: 24px;
    display: flex; align-items: center; justify-content: center;
  }
  /* 图标：现代简洁风（选中实心填充 / 未选中细线描边） */
  .icon {
    position: relative; z-index: 1;
    width: 24px; height: 24px;
    background-repeat: no-repeat; background-position: center; background-size: contain;
  }
  .halo {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
    z-index: 0; width: 23px; height: 23px; border-radius: 50%;
    background: rgba(99,102,241,0.14);
  }
  .icon-home { background-image: url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%2024%2024%27%3E%3Cpath%20d%3D%27M12%203L4%2010v10h6v-6h4v6h6V10z%27%20fill%3D%27none%27%20stroke%3D%27%23999999%27%20stroke-width%3D%271.8%27%20stroke-linejoin%3D%27round%27%20stroke-linecap%3D%27round%27%2F%3E%3C%2Fsvg%3E"); }
  .tb.on .icon-home { background-image: url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%2024%2024%27%3E%3Cpath%20d%3D%27M12%202.5L3.5%2010l1.5%201.5V20h5v-6h4v6h5v-8.5l1.5-1.5z%27%20fill%3D%27%236366F1%27%2F%3E%3C%2Fsvg%3E"); }
  .icon-task { background-image: url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%2024%2024%27%3E%3Ccircle%20cx%3D%2712%27%20cy%3D%2712%27%20r%3D%279%27%20fill%3D%27none%27%20stroke%3D%27%23999999%27%20stroke-width%3D%271.8%27%2F%3E%3Cpath%20d%3D%27M8%2012l2.5%202.5L16%209%27%20fill%3D%27none%27%20stroke%3D%27%23999999%27%20stroke-width%3D%271.8%27%20stroke-linecap%3D%27round%27%20stroke-linejoin%3D%27round%27%2F%3E%3C%2Fsvg%3E"); }
  .tb.on .icon-task { background-image: url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%2024%2024%27%3E%3Ccircle%20cx%3D%2712%27%20cy%3D%2712%27%20r%3D%279%27%20fill%3D%27%236366F1%27%2F%3E%3Cpath%20d%3D%27M8%2011.5l2.5%202.5L16%208.5%27%20fill%3D%27none%27%20stroke%3D%27%23fff%27%20stroke-width%3D%272%27%20stroke-linecap%3D%27round%27%20stroke-linejoin%3D%27round%27%2F%3E%3C%2Fsvg%3E"); }
  .icon-book { background-image: url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%2024%2024%27%3E%3Cpath%20d%3D%27M5%204h5.5v16H5.5c-.8%200-1.5-.7-1.5-1.5V5.5C4%204.7%204.7%204%205%204z%27%20fill%3D%27none%27%20stroke%3D%27%23999999%27%20stroke-width%3D%271.8%27%20stroke-linejoin%3D%27round%27%2F%3E%3Cpath%20d%3D%27M19%204h-5.5v16H18.5c.8%200%201.5-.7%201.5-1.5V5.5c0-.8-.7-1.5-1.5-1.5z%27%20fill%3D%27none%27%20stroke%3D%27%23999999%27%20stroke-width%3D%271.8%27%20stroke-linejoin%3D%27round%27%2F%3E%3Cline%20x1%3D%2712%27%20y1%3D%274%27%20x2%3D%2712%27%20y2%3D%2720%27%20stroke%3D%27%23999999%27%20stroke-width%3D%271.8%27%2F%3E%3C%2Fsvg%3E"); }
  .tb.on .icon-book { background-image: url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%2024%2024%27%3E%3Cpath%20d%3D%27M5%204h5.5v16H5.5c-.8%200-1.5-.7-1.5-1.5V5.5C4%204.7%204.7%204%205%204z%27%20fill%3D%27%236366F1%27%2F%3E%3Cpath%20d%3D%27M19%204h-5.5v16H18.5c.8%200%201.5-.7%201.5-1.5V5.5c0-.8-.7-1.5-1.5-1.5z%27%20fill%3D%27%236366F1%27%2F%3E%3Crect%20x%3D%2711.2%27%20y%3D%274%27%20width%3D%271.6%27%20height%3D%2716%27%20rx%3D%27.8%27%20fill%3D%27%23fff%27%2F%3E%3C%2Fsvg%3E"); }
  .icon-mine { background-image: url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%2024%2024%27%3E%3Ccircle%20cx%3D%2712%27%20cy%3D%277.5%27%20r%3D%274%27%20fill%3D%27none%27%20stroke%3D%27%23999999%27%20stroke-width%3D%271.8%27%2F%3E%3Cpath%20d%3D%27M4.5%2021c0-4%203.5-6.5%207.5-6.5s7.5%202.5%207.5%206.5%27%20fill%3D%27none%27%20stroke%3D%27%23999999%27%20stroke-width%3D%271.8%27%20stroke-linecap%3D%27round%27%2F%3E%3C%2Fsvg%3E"); }
  .tb.on .icon-mine { background-image: url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%2024%2024%27%3E%3Ccircle%20cx%3D%2712%27%20cy%3D%277.5%27%20r%3D%274%27%20fill%3D%27%236366F1%27%2F%3E%3Cpath%20d%3D%27M4.5%2021c0-4%203.5-6.5%207.5-6.5s7.5%202.5%207.5%206.5%27%20fill%3D%27%236366F1%27%2F%3E%3C%2Fsvg%3E"); }

  .note { position: absolute; bottom: 8px; left: 0; right: 0; text-align: center; color:#999; font-size:12px; }
</style>
</head>
<body>
  <div class="phone">
    <div class="screen-content">
      <div class="demo-card"><h3>首页内容区</h3><p>这里是页面内容。底部导航栏用与小程序完全一致的 CSS 渲染。</p></div>
      <div class="demo-card"><h3>任务 / 经典 / 我的</h3><p>切换 Tab 看选中态变化（当前选中「首页」）。</p></div>
    </div>

    <!-- 导航栏：完全还原小程序结构 -->
    <div class="tabbar">
      <div class="glass-wash"></div>
      <div class="tb on">
        <div class="icon-wrap"><div class="halo"></div><div class="icon icon-home"></div></div>
        <span>首页</span>
      </div>
      <div class="tb">
        <div class="icon-wrap"><div class="icon icon-task"></div></div>
        <span>任务</span>
      </div>
      <div class="tb">
        <div class="icon-wrap"><div class="icon icon-book"></div></div>
        <span>经典</span>
      </div>
      <div class="tb">
        <div class="icon-wrap"><div class="icon icon-mine"></div></div>
        <span>我的</span>
      </div>
    </div>

    <div class="note">↑ 这就是你小程序里导航栏的真实渲染效果</div>
  </div>
</body>
</html>
