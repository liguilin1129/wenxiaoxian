<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的页 · 会员中心风格 1:1 预览</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #F5F5F7;
      display: flex;
      justify-content: center;
      padding: 40px 20px;
    }
    .phone {
      width: 375px;
      height: 812px;
      background: #F5F5F7;
      border-radius: 44px;
      box-shadow: 0 20px 60px rgba(0,0,0,.12);
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
    }
    .screen {
      flex: 1;
      overflow-y: auto;
      padding-bottom: 40px;
    }

    /* header */
    .profile-header {
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 70px 24px 34px;
      background: linear-gradient(180deg, #FFF7ED 0%, #FFEDD5 100%);
    }
    .avatar {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: linear-gradient(135deg, #6366F1, #8B5CF6);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: 700;
      flex: none;
    }
    .profile-info { flex: 1; }
    .profile-name { font-size: 22px; font-weight: 800; color: #1A1A2E; }
    .profile-level { font-size: 14px; color: #8B6F4E; margin-top: 4px; }
    .profile-edit {
      font-size: 14px;
      font-weight: 600;
      color: #8B5A2B;
      background: rgba(255,255,255,.65);
      padding: 7px 16px;
      border-radius: 999px;
      border: 1px solid rgba(139,90,43,.12);
    }

    /* vip */
    .vip-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 16px 20px 0;
      padding: 20px 22px;
      border-radius: 16px;
      background: linear-gradient(135deg, #5A4632 0%, #7C5E44 100%);
      box-shadow: 0 4px 14px rgba(90,70,50,.22);
      color: #fff;
    }
    .vip-title { font-size: 18px; font-weight: 800; }
    .vip-desc { font-size: 13px; opacity: .75; margin-top: 4px; }
    .vip-btn {
      padding: 8px 16px;
      border-radius: 999px;
      background: rgba(255,255,255,.92);
      color: #5A4632;
      font-size: 13px;
      font-weight: 700;
    }

    /* level bar */
    .level-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 12px 20px 0;
      padding: 14px 18px;
      border-radius: 14px;
      background: linear-gradient(90deg, #EEF2FF 0%, #F5F3FF 100%);
      border: 1px solid #E0E7FF;
    }
    .level-left { display: flex; align-items: center; gap: 8px; }
    .level-icon { font-size: 18px; }
    .level-name { font-size: 15px; font-weight: 700; color: #4338CA; }
    .level-tag {
      font-size: 11px;
      color: #8B8B9E;
      background: #fff;
      padding: 2px 7px;
      border-radius: 6px;
    }
    .level-right { font-size: 13px; color: #6366F1; }

    /* stats */
    .stats-card {
      display: flex;
      flex-wrap: wrap;
      margin: 16px 20px 0;
      padding: 18px 0;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 1px 4px rgba(17,17,26,.04);
      border: 1px solid #ECECF1;
    }
    .stat-item {
      width: 33.333%;
      text-align: center;
      padding: 12px 0;
    }
    .stat-num { font-size: 24px; font-weight: 800; color: #1A1A2E; }
    .stat-label { font-size: 12px; color: #8B8B9E; margin-top: 4px; }

    /* tools */
    .tools-section {
      margin: 16px 20px 0;
      background: #fff;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 1px 4px rgba(17,17,26,.04);
      border: 1px solid #ECECF1;
    }
    .section-title {
      font-size: 17px;
      font-weight: 700;
      color: #1A1A2E;
      margin-bottom: 16px;
    }
    .tools-grid { display: flex; flex-wrap: wrap; }
    .tool-item {
      width: 25%;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px 0;
    }
    .tool-icon {
      width: 50px;
      height: 50px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
    }
    .tool-name { font-size: 12px; color: #444456; margin-top: 8px; }

    /* menu */
    .menu {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #fff;
      border: 1px solid #ECECF1;
      border-radius: 16px;
      padding: 18px 18px;
      margin: 12px 20px 0;
      box-shadow: 0 1px 4px rgba(17,17,26,.04);
    }
    .menu .mt { font-size: 15px; font-weight: 600; color: #1A1A2E; display: flex; align-items: center; gap: 12px; }
    .menu .mi {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: #EEEDFE;
      color: #4F46E5;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }
    .menu .mv { font-size: 13px; color: #8B8B9E; }

    .btn {
      display: block;
      width: calc(100% - 40px);
      margin: 16px 20px 0;
      padding: 14px;
      border-radius: 14px;
      background: #EEEDFE;
      color: #4338CA;
      font-size: 15px;
      font-weight: 700;
      border: none;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="phone">
    <div class="screen">
      <div class="profile-header">
        <div class="avatar">贤</div>
        <div class="profile-info">
          <div class="profile-name">文小贤</div>
          <div class="profile-level">君子少年 · Lv.5</div>
        </div>
        <div class="profile-edit">编辑</div>
      </div>

      <div class="vip-card">
        <div>
          <div class="vip-title">VIP 超级会员</div>
          <div class="vip-desc">畅享专属成长权益</div>
        </div>
        <div class="vip-btn">立即续费</div>
      </div>

      <div class="level-bar">
        <div class="level-left">
          <span class="level-icon">💎</span>
          <span class="level-name">普通会员</span>
          <span class="level-tag">未解锁</span>
        </div>
        <div class="level-right">0元入会，享专属等级权益 ›</div>
      </div>

      <div class="stats-card">
        <div class="stat-item"><div class="stat-num">3</div><div class="stat-label">我的任务</div></div>
        <div class="stat-item"><div class="stat-num">0</div><div class="stat-label">账户(¥)</div></div>
        <div class="stat-item"><div class="stat-num">0</div><div class="stat-label">会员卡</div></div>
        <div class="stat-item"><div class="stat-num">1280</div><div class="stat-label">积分</div></div>
        <div class="stat-item"><div class="stat-num">0</div><div class="stat-label">券码</div></div>
        <div class="stat-item"><div class="stat-num">0</div><div class="stat-label">收藏</div></div>
      </div>

      <div class="tools-section">
        <div class="section-title">必备工具</div>
        <div class="tools-grid">
          <div class="tool-item"><div class="tool-icon" style="background:#FFF1F3;color:#E11D6F">🏆</div><div class="tool-name">我的成就</div></div>
          <div class="tool-item"><div class="tool-icon" style="background:#ECFDF5;color:#0F9D6B">🎁</div><div class="tool-name">我的奖品</div></div>
          <div class="tool-item"><div class="tool-icon" style="background:#F5F3FF;color:#7C3AED">⚙️</div><div class="tool-name">账号设置</div></div>
          <div class="tool-item"><div class="tool-icon" style="background:#EEF2FF;color:#4338CA">🧾</div><div class="tool-name">积分明细</div></div>
          <div class="tool-item"><div class="tool-icon" style="background:#FFFBEB;color:#B7791F">📊</div><div class="tool-name">成长报告</div></div>
          <div class="tool-item"><div class="tool-icon" style="background:#F0FDFA;color:#0D9488">✏️</div><div class="tool-name">编辑资料</div></div>
        </div>
      </div>

      <div class="section-title" style="margin:18px 20px 0;font-size:17px">更多服务</div>
      <div class="menu">
        <div class="mt"><div class="mi">📖</div>经典书架</div>
        <div class="mv">17 部 ›</div>
      </div>
      <div class="menu">
        <div class="mt"><div class="mi">👨‍👩‍👦</div>家庭成员</div>
        <div class="mv">爸爸 · 妈妈 ›</div>
      </div>

      <button class="btn">退出成长花园</button>
    </div>
  </div>
</body>
</html>
