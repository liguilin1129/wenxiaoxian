<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>经典阅读页 1:1 预览</title>
<style>
  :root{
    --brand:#6366F1; --brand-600:#4F46E5; --brand-700:#4338CA;
    --brand-soft:#EEEDFE; --brand-soft2:#E0E7FF;
    --bg:#F5F5F7; --surface:#FFFFFF; --surface-2:#FAFAFB;
    --ink-1:#1A1A2E; --ink-2:#444456; --ink-3:#8B8B9E;
    --line:#ECECF1; --line-2:#F0F0F4;
    --radius:32rpx; --radius-sm:24rpx; --radius-xs:20rpx;
    --c-heart:#FB7185; --c-heart-bg:#FFF1F3; --c-heart-d:#E11D6F;
    --c-body:#34D399; --c-body-bg:#ECFDF5; --c-body-d:#0F9D6B;
    --c-habit:#6366F1; --c-habit-bg:#EEEDFE; --c-habit-d:#4F46E5;
    --c-taste:#FBBF24; --c-taste-bg:#FFFBEB; --c-taste-d:#B7791F;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased;}
  body{background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;color:var(--ink-1);}
  .phone{width:390px;margin:24px auto;background:var(--bg);border-radius:44px;overflow:hidden;box-shadow:0 20px 60px rgba(17,17,26,.18);border:10px solid #1c1c22;position:relative;min-height:760px;}
  .statusbar{height:44px;background:var(--surface);display:flex;align-items:center;justify-content:space-between;padding:0 24px;font-size:13px;font-weight:600;color:var(--ink-1);}
  .statusbar .icons{display:flex;gap:6px;align-items:center;}
  .nav{height:44px;background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600;color:var(--ink-1);border-bottom:1px solid var(--line);position:relative;}
  .nav .back{position:absolute;left:14px;font-size:22px;color:var(--brand-700);cursor:pointer;}

  .scr-head{padding:26px 24px 16px;background:var(--surface);}
  .scr-head .greet{font-size:13px;color:var(--ink-3);}
  .scr-head .title{font-size:26px;font-weight:700;margin-top:4px;letter-spacing:-.5px;}
  .scr-head .prog{display:flex;align-items:center;gap:14px;margin-top:14px;}
  .scr-head .pbar{flex:1;height:8px;border-radius:999px;background:var(--line-2);overflow:hidden;}
  .scr-head .pfill{display:block;height:100%;border-radius:999px;background:var(--c-heart);}
  .scr-head .ptxt{font-size:13px;color:var(--ink-3);flex:none;}

  .scr-body{padding:16px 22px 60px;}
  .h3{font-size:17px;font-weight:700;margin:6px 3px 12px;}

  .ch{display:flex;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);padding:16px 17px;margin-bottom:11px;box-shadow:0 1px 4px rgba(17,17,26,.04);cursor:pointer;}
  .ch-l{display:flex;align-items:center;gap:14px;min-width:0;}
  .ch-no{width:34px;height:34px;border-radius:10px;flex:none;background:var(--brand-soft);color:var(--brand-700);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;}
  .ch-t{font-size:16px;font-weight:600;color:var(--ink-1);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .ch-r{display:flex;align-items:center;gap:9px;flex:none;}
  .ch .tag{font-size:12px;padding:2px 9px;border-radius:999px;background:var(--c-taste-bg);color:var(--c-taste-d);font-weight:600;}
  .ch .ck{color:var(--c-body-d);font-weight:800;font-size:17px;}
  .ch .ar{color:var(--ink-3);font-size:22px;}
  .muted{color:var(--ink-3);font-size:13px;text-align:center;margin-top:14px;}

  .reader-wrap{display:none;}
  .ch-head{display:flex;align-items:baseline;gap:11px;margin-bottom:13px;}
  .ch-no2{font-size:13px;color:var(--brand-700);font-weight:700;flex:none;}
  .ch-title2{font-size:20px;font-weight:700;color:var(--ink-1);}
  .reader{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);padding:22px 21px;font-size:18px;line-height:2.0;color:var(--ink-1);white-space:pre-wrap;word-break:break-all;letter-spacing:.5px;box-shadow:0 1px 4px rgba(17,17,26,.04);}
  .sample-note{font-size:12px;color:var(--ink-3);margin-top:9px;text-align:center;}
  .nav{height:auto;background:transparent;border:none;display:flex;gap:11px;margin-top:18px;border-bottom:none;}
  .navbtn{flex:1;text-align:center;padding:13px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-xs);font-size:15px;font-weight:600;color:var(--brand-700);cursor:pointer;}
  .navbtn.mid{flex:0 0 96px;background:var(--brand-soft);}
  .navbtn.dis{color:var(--ink-3);background:var(--surface-2);}

  .hint{text-align:center;font-size:13px;color:var(--ink-3);margin:10px 0 0;}
</style>
</head>
<body>
<div class="phone">
  <div class="statusbar"><span>9:41</span><span class="icons">●●● 5G ▮▮▮</span></div>
  <div class="nav"><span class="back" onclick="backToDir()" id="navBack" style="display:none">‹</span><span id="navTitle">经典诵读</span></div>

  <!-- 目录 -->
  <div id="dirView">
    <div class="scr-head">
      <div class="greet">经典诵读</div>
      <div class="title">《论语》</div>
      <div class="prog">
        <div class="pbar"><div class="pfill" style="width:15%;background:var(--c-heart)"></div></div>
        <div class="ptxt">已读 3 / 20 章</div>
      </div>
    </div>
    <div class="scr-body">
      <div class="h3">目录</div>
      <div id="chList"></div>
      <div class="muted">点击章节开始诵读，读过即计入已读进度</div>
    </div>
  </div>

  <!-- 阅读器 -->
  <div id="readerView" class="reader-wrap">
    <div class="scr-head">
      <div class="greet">经典诵读</div>
      <div class="title">《论语》</div>
    </div>
    <div class="scr-body">
      <div class="ch-head"><span class="ch-no2" id="rNo">第1章</span><span class="ch-title2" id="rTitle"></span></div>
      <div class="reader" id="rBody"></div>
      <div class="sample-note" id="rSample" style="display:none">（本章为原型示例内容，正式校勘文本后续版本补全）</div>
      <div class="nav">
        <div class="navbtn" id="prevBtn" onclick="goPrev()">‹ 上一章</div>
        <div class="navbtn mid" onclick="backToDir()">目录</div>
        <div class="navbtn" id="nextBtn" onclick="goNext()">下一章 ›</div>
      </div>
    </div>
  </div>
</div>
<div class="hint">预览：点目录任意章节 → 进入阅读器（带上一章/下一章/目录）；首次打开计“已读+1”，返回书架进度同步</div>

<script>
// 论语前 6 章（真实）+ 1 示例章，用于预览演示
const chapters = [
  {no:1,title:'学而第一',body:'子曰：「学而时习之，不亦说乎？有朋自远方来，不亦乐乎？人不知而不愠，不亦君子乎？」\n\n有子曰：「其为人也孝弟，而好犯上者，鲜矣；不好犯上，而好作乱者，未之有也。君子务本，本立而道生。孝弟也者，其为仁之本与！」',sample:false},
  {no:2,title:'为政第二',body:'子曰：「为政以德，譬如北辰，居其所而众星共之。」\n\n子曰：「诗三百，一言以蔽之，曰：思无邪。」\n\n子曰：「吾十有五而志于学，三十而立，四十而不惑，五十而知天命，六十而耳顺，七十而从心所欲，不逾矩。」',sample:false},
  {no:3,title:'八佾第三',body:'孔子谓季氏：「八佾舞于庭，是可忍也，孰不可忍也？」\n\n子曰：「人而不仁，如礼何？人而不仁，如乐何？」',sample:false},
  {no:4,title:'里仁第四',body:'子曰：「里仁为美。择不处仁，焉得知？」\n\n子曰：「不仁者不可以久处约，不可以长处乐。仁者安仁，知者利仁。」\n\n子曰：「朝闻道，夕死可矣。」',sample:false},
  {no:5,title:'公冶长第五',body:'子谓公冶长：「可妻也。虽在缧绁之中，非其罪也。」以其子妻之。',sample:false},
  {no:6,title:'雍也第六',body:'子曰：「雍也可使南面。」',sample:false},
  {no:7,title:'述而第七',body:'（原型示例段落）本章为体验占位内容，正式校勘文本将在后续版本补全。你可在「示例章节」中完整体验：目录 → 阅读 → 已读进度同步 的阅读流程。',sample:true}
];
let done = {1:true,2:true,3:true}; // 已读 3 章
let curIndex = -1;

function renderList(){
  const wrap = document.getElementById('chList');
  wrap.innerHTML = chapters.map((c,i)=>`
    <div class="ch" onclick="openChapter(${i})">
      <div class="ch-l"><div class="ch-no">${c.no}</div><div class="ch-t">${c.title}</div></div>
      <div class="ch-r">
        ${c.sample?'<text class="tag">示例</text>':''}
        ${done[c.no]?'<text class="ck">✓</text>':'<text class="ar">›</text>'}
      </div>
    </div>`).join('');
}
function openChapter(i){
  curIndex = i;
  const c = chapters[i];
  document.getElementById('dirView').style.display='none';
  document.getElementById('readerView').style.display='block';
  document.getElementById('navBack').style.display='block';
  document.getElementById('navTitle').textContent = '诵读《论语》';
  document.getElementById('rNo').textContent = '第'+c.no+'章';
  document.getElementById('rTitle').textContent = c.title;
  document.getElementById('rBody').textContent = c.body;
  document.getElementById('rSample').style.display = c.sample?'block':'none';
  document.getElementById('prevBtn').className = 'navbtn'+(i>0?'':' dis');
  document.getElementById('nextBtn').className = 'navbtn'+(i<chapters.length-1?'':' dis');
  if(!done[c.no]){ done[c.no]=true; /* 真实场景会已读+1并写回 */ }
  renderList();
}
function goPrev(){ if(curIndex>0) openChapter(curIndex-1); }
function goNext(){ if(curIndex<chapters.length-1) openChapter(curIndex+1); }
function backToDir(){
  document.getElementById('readerView').style.display='none';
  document.getElementById('dirView').style.display='block';
  document.getElementById('navBack').style.display='none';
  document.getElementById('navTitle').textContent='经典诵读';
  renderList();
}
renderList();
</script>
</body>
</html>
