services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wenxiaoxian
      POSTGRES_USER: wenxiaoxian
      POSTGRES_PASSWORD: wenxiaoxian_dev_password
    # 避开开发机上可能已存在的 PostgreSQL（常用 5432 端口）。
    ports: ["5433:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: ["redis_data:/data"]
  minio:
    # 文件上传模块接入前不启动对象存储，避免它阻塞核心后台开发环境。
    # 需要文件存储时使用：docker compose --profile storage up -d minio
    profiles: ["storage"]
    image: quay.io/minio/aistor/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: wenxiaoxian
      MINIO_ROOT_PASSWORD: wenxiaoxian_dev_secret
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio_data:/data"]
volumes:
  postgres_data:
  redis_data:
  minio_data:
